name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Protocol tests
        run: java tests/RunTests.java
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GhostCardLab-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GhostCardLab-debug-apk
          path: GhostCardLab-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" GhostCardLab-debug.apk --title "GhostCard Lab $TAG" --notes "Debug APK, auto-built." --repo "${{ github.repository }}"
