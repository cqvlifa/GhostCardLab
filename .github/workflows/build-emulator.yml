name: Build Emulator APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'emulator/**'
      - '.github/workflows/build-emulator.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: emulator
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NFCEmulator-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NFCEmulator-debug-apk
          path: emulator/NFCEmulator-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="emulator-${{ github.run_number }}"
          gh release create "$TAG" NFCEmulator-debug.apk \
            --title "NFC Emulator $TAG" \
            --notes "Debug APK, auto-built from emulator/." \
            --repo "${{ github.repository }}"
